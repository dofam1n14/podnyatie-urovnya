# Сборка Android-приложения (APK) в облаке GitHub при каждом push.
# Готовый файл появляется в Releases: .../releases/download/apk/sistema.apk
name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:   # кнопка «Run workflow» для ручного запуска

permissions:
  contents: write      # нужно, чтобы выложить APK в Releases и сохранить ключ подписи

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Установить Capacitor
        run: npm install

      # Файлы сайта кладём в www — оттуда Capacitor берёт их в приложение
      - name: Собрать папку www
        run: |
          mkdir -p www
          cp index.html style.css app.js manifest.webmanifest icon.svg icon-192.png icon-512.png www/

      - name: Создать Android-проект
        run: npx cap add android

      - name: Иконки приложения
        run: npx capacitor-assets generate --android --iconBackgroundColor "#05070f" --iconBackgroundColorDark "#05070f" --splashBackgroundColor "#05070f" --splashBackgroundColorDark "#05070f"

      - name: Скопировать сайт и плагины в Android-проект
        run: npx cap sync android

      # Номер версии = номер сборки, чтобы телефон видел обновление
      - name: Номер версии
        run: sed -i "s/versionCode 1$/versionCode ${{ github.run_number }}/" android/app/build.gradle

      # Один и тот же ключ подписи для всех сборок, иначе новая версия не встанет поверх старой.
      # При первом запуске ключ создаётся и сохраняется в репозиторий.
      - name: Ключ подписи
        run: |
          if [ ! -f android-build/debug.keystore ]; then
            mkdir -p android-build
            keytool -genkeypair -keystore android-build/debug.keystore -storepass android -keypass android \
              -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
            git config user.name "github-actions"
            git config user.email "github-actions@users.noreply.github.com"
            git add android-build/debug.keystore
            git commit -m "Ключ подписи APK"
            git push
          fi
          mkdir -p ~/.android
          cp android-build/debug.keystore ~/.android/debug.keystore

      # Лог пишем в файл: при ошибке хвост попадёт в «Annotations», их видно без входа в GitHub
      - name: Собрать APK
        working-directory: android
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee ../build.log

      - name: Показать ошибку сборки
        if: failure()
        run: |
          grep -E -A12 "What went wrong|error:|FAILURE" build.log | head -60 > err.txt || tail -60 build.log > err.txt
          [ -s err.txt ] || tail -60 build.log > err.txt
          msg=$(sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g' err.txt)
          echo "::error title=Gradle::$msg"

      - name: Выложить APK в Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk sistema.apk
          gh release delete apk --yes --cleanup-tag || true
          gh release create apk sistema.apk --title "Система для Android (сборка ${{ github.run_number }})" \
            --notes "Скачай sistema.apk на телефон и установи. Новые версии ставятся поверх, прогресс сохраняется."
