<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Иконка: синее окно Системы с буквой S (ранг S) -->
  <defs>
    <radialGradient id="bg" cx="50%" cy="35%" r="75%">
      <stop offset="0" stop-color="#14306b"/>
      <stop offset="1" stop-color="#05070f"/>
    </radialGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <rect x="96" y="96" width="320" height="320" rx="14" fill="none" stroke="#39b8ff" stroke-width="10" filter="url(#glow)"/>
  <text x="256" y="330" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="230" fill="#e8f6ff" filter="url(#glow)">S</text>
</svg>
